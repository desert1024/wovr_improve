name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python sources
        run: |
          python -m compileall -q rlinf evaluations examples/embodiment toolkits
      - name: Check scripts syntax
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done
          python -m py_compile scripts/convert_ckpt_to_hf.py
